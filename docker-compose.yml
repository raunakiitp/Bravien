services:
  postgres:
    image: postgres:16-alpine
    container_name: bravien-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: bravien
      POSTGRES_PASSWORD: bravien
      POSTGRES_DB: bravien
    volumes:
      - bravien_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bravien -d bravien"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bravien_pgdata:
